name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install linters
      run: |
        python -m pip install --upgrade pip
        pip install ruff black

    - name: Check formatting with Black
      run: black --check bio_seq_v1/ tests/

    - name: Lint with Ruff
      run: ruff check bio_seq_v1/ tests/
