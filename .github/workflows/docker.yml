name: Docker Image CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:quay.io/priyal_tripathi/bioseq

    - name: Smoke test
      run: docker run quay.io/priyal_tripathi/bioseq:latest --help

    - name: Login to Quay.io
      run: docker login quay.io -u ${{ secrets.QUAY_USERNAME }} -p ${{ secrets.QUAY_PASSWORD }}

    - name: Push to Quay.io
      if: github.event_name == 'push'
      run: docker push quay.io/priyal_tripathi/bioseq:latest

